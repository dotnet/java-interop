pluginManagement {
    def sharedRepositories = file("${rootDir}/../../../../eng/gradle/plugin-repositories.gradle")
    if (sharedRepositories.exists()) {
        apply from: sharedRepositories, to: pluginManagement
    } else {
        repositories {
            if (System.getenv('RUNNINGONCI') == 'true') {
                maven {
                    url = 'https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-maven/maven/v1'
                    name = 'dotnet-public-maven'
                }
            } else {
                gradlePluginPortal()
                mavenCentral()
            }
        }
    }
}
dependencyResolutionManagement {
    def sharedRepositories = file("${rootDir}/../../../../eng/gradle/dependency-repositories.gradle")
    if (sharedRepositories.exists()) {
        apply from: sharedRepositories, to: dependencyResolutionManagement
    } else {
        repositories {
            if (System.getenv('RUNNINGONCI') == 'true') {
                maven {
                    url = 'https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-maven/maven/v1'
                    name = 'dotnet-public-maven'
                }
            } else {
                mavenCentral()
            }
        }
    }
}

rootProject.name = 'java-source-utils'
